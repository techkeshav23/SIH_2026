name: kalasetu
description: "AI Market Linkage & Smart Cataloging for Artisans (SIH 26090)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # media capture
  image_picker: ^1.1.2
  # NOTE: in-app voice recording temporarily removed — the `record` package's
  # federated linux impl (record_linux 0.7.2) is source-incompatible with
  # record_platform_interface 1.6.0 and breaks the release compile. The backend
  # voice endpoint stays; re-add a compatible recorder to restore mic capture.

  # local storage (offline drafts)
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # accessibility — read screens aloud (low-literacy support)
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/demo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF6EE"
  adaptive_icon_foreground: "assets/icon/logo.png"
