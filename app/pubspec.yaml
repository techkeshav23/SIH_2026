name: kalasetu
description: "AI Market Linkage & Smart Cataloging for Artisans (SIH 26090)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # Indian number/currency formatting (₹ with lakh/crore grouping)
  intl: ^0.20.2

  # media capture
  image_picker: ^1.1.2

  # local storage (offline drafts)
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # accessibility — read screens aloud (low-literacy support)
  flutter_tts: ^4.2.0
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/hero.jpg
    - assets/demo/
  fonts:
    # Mukta (Ek Type) — one family for Latin + Devanagari so Hindi and English
    # feel like the same app. Replaces the default Roboto.
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF6EE"
  adaptive_icon_foreground: "assets/icon/logo.png"
