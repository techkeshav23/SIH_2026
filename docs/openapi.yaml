openapi: 3.0.3
info:
  title: KalaSetu API
  description: |
    AI Market Linkage & Smart Cataloging backend for artisans (SIH 26090).
    Frozen contract — mobile and backend build against this. Change via PR only.
  version: 0.1.0
servers:
  - url: http://localhost:8000
    description: Local dev
  - url: https://kalasetu-api.onrender.com
    description: Deployed (Render)

tags:
  - name: auth
  - name: products
  - name: ai
  - name: pricing
  - name: buyers

paths:
  /health:
    get:
      tags: [auth]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/request-otp:
    post:
      tags: [auth]
      summary: Request an OTP for a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+919876543210" }
      responses:
        "200": { description: OTP sent (dev: returns otp) , content: { application/json: { schema: { $ref: '#/components/schemas/OtpSent' } } } }

  /auth/verify-otp:
    post:
      tags: [auth]
      summary: Verify OTP, get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string }
                otp: { type: string, example: "123456" }
      responses:
        "200": { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthToken' } } } }
        "401": { description: Invalid OTP }

  /me:
    get:
      tags: [auth]
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [auth]
      summary: Update profile (name, language, craft, region)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /products:
    get:
      tags: [products]
      summary: List my products
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, processing, ready, listed] } }
      responses:
        "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }
    post:
      tags: [products]
      summary: Create a product draft
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }

  /products/{id}:
    get:
      tags: [products]
      summary: Get one product (poll here for AI status)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        "404": { description: Not found }
    patch:
      tags: [products]
      summary: Update product (edit AI output, set final price, list it)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }

  /ai/enhance-image:
    post:
      tags: [ai]
      summary: "F1 — enhance a product image (bg removal, lighting, crop). Async."
      description: Upload raw image; sets product.status=processing, fills enhanced_image_url when done.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [product_id, file]
              properties:
                product_id: { type: string }
                file: { type: string, format: binary }
      responses:
        "202": { description: Accepted, processing, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }

  /ai/catalog-from-voice:
    post:
      tags: [ai]
      summary: "F2 — voice note → SEO listing (EN+HI). Async."
      description: Upload audio; STT → translate → LLM → fills title/desc/category. Poll product for result.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [product_id, file]
              properties:
                product_id: { type: string }
                file: { type: string, format: binary }
                source_lang: { type: string, example: "hi", description: "ISO code; auto if omitted" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }

  /ai/catalog-from-text:
    post:
      tags: [ai]
      summary: "F2 fallback — typed rough description → SEO listing (EN+HI)."
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [product_id, text]
              properties:
                product_id: { type: string }
                text: { type: string }
                source_lang: { type: string, example: "hi" }
      responses:
        "200": { description: Listing, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }

  /pricing/suggest:
    post:
      tags: [pricing]
      summary: "F3 — suggest a competitive price range with reasoning."
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string }
                material_cost: { type: number, description: "artisan-entered raw material cost (INR)" }
      responses:
        "200": { description: Price suggestion, content: { application/json: { schema: { $ref: '#/components/schemas/PriceSuggestion' } } } }

  /buyers/feed:
    get:
      tags: [buyers]
      summary: Public listed products (B2B/buyer discovery — simulated ONDC/GeM)
      parameters:
        - { in: query, name: category, schema: { type: string } }
      responses:
        "200": { description: Feed, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }

  /buyers/inquiries:
    post:
      tags: [buyers]
      summary: Buyer sends an inquiry on a listed product
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [product_id, org_name, message]
              properties:
                product_id: { type: string }
                org_name: { type: string }
                message: { type: string }
      responses:
        "201": { description: Inquiry created, content: { application/json: { schema: { $ref: '#/components/schemas/Inquiry' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    OtpSent:
      type: object
      properties:
        sent: { type: boolean }
        dev_otp: { type: string, nullable: true, description: "only in dev mode" }
    AuthToken:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: string, nullable: true }
        language_pref: { type: string, example: hi }
        craft_type: { type: string, nullable: true }
        region: { type: string, nullable: true }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        language_pref: { type: string }
        craft_type: { type: string }
        region: { type: string }
    ProductStatus:
      type: string
      enum: [draft, processing, ready, listed]
    Product:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title_en: { type: string, nullable: true }
        title_hi: { type: string, nullable: true }
        desc_en: { type: string, nullable: true }
        desc_hi: { type: string, nullable: true }
        category: { type: string, nullable: true }
        material: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/ProductStatus' }
        raw_image_url: { type: string, nullable: true }
        enhanced_image_url: { type: string, nullable: true }
        suggested_price_min: { type: number, nullable: true }
        suggested_price_max: { type: number, nullable: true }
        final_price: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductCreate:
      type: object
      properties:
        category: { type: string }
        material: { type: string }
    ProductUpdate:
      type: object
      properties:
        title_en: { type: string }
        title_hi: { type: string }
        desc_en: { type: string }
        desc_hi: { type: string }
        category: { type: string }
        material: { type: string }
        tags: { type: array, items: { type: string } }
        final_price: { type: number }
        status: { $ref: '#/components/schemas/ProductStatus' }
    JobAccepted:
      type: object
      properties:
        product_id: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        message: { type: string, example: "processing — poll GET /products/{id}" }
    PriceSuggestion:
      type: object
      properties:
        product_id: { type: string }
        suggested_price_min: { type: number }
        suggested_price_max: { type: number }
        currency: { type: string, example: INR }
        reasoning: { type: string }
        comparables:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              price: { type: number }
              source: { type: string }
    Inquiry:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        org_name: { type: string }
        message: { type: string }
        status: { type: string, example: new }
        created_at: { type: string, format: date-time }
